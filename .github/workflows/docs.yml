name: Docs

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - 'docs/*'
  pull_request:
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - 'docs/*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim-version: ['stable', 'devel']
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim environment
        uses: alaviss/setup-nim@v1
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Generate docs
        run: |
          mkdir -p docs/plugins docs/ecs
          nim doc --index:on --outdir:docs/plugins src/plugins/plugins.nim
          nim doc --index:on --outdir:docs/ecs src/ecs/table.nim
          
          # Fusionne les index de recherche pour vos différents modules
          buildindex docs

      - name: Upload Artifacts
        if: matrix.nim-version == 'stable' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
